name: Weekly link check

# Checks every https URL in data/packs. Broken links (404/410) open or update one issue
# labelled "link-check"; it is closed again when everything resolves. Never edits data.
on:
  schedule:
    - cron: '41 15 * * 1' # Mondays 15:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links-weekly
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check links
        id: links
        continue-on-error: true
        run: npx tsx scripts/check-links.ts --strict > link-report.md

      - name: Add the report to the job summary
        if: ${{ always() }}
        run: cat link-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the broken-links issue
        if: ${{ steps.links.outcome == 'failure' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const label = 'link-check';
            const title = 'Broken links in the data packs';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('link-report.md') ? fs.readFileSync('link-report.md', 'utf8') : '';
            if (!report.includes('## Broken (404/410)')) {
              core.setFailed(`The link checker failed without reporting broken links — see ${runUrl}`);
              return;
            }
            const footer = `\n\n---\nFound by the [weekly link check](${runUrl}). The checker never changes data: fix the URL in \`data/packs/\`, or remove the fact and list it in \`unverified.json\`. Then run \`npm run pack:manifest\` and \`npm run gen:verification\`.`;
            const max = 60000;
            const body = (report.length > max ? report.slice(0, max) + '\n\n…(truncated — full report in the run summary)' : report) + footer;

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a', description: 'Opened by the weekly link check' });
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label, per_page: 20 });
            const existing = open.find((i) => !i.pull_request);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Still broken as of ${new Date().toISOString().slice(0, 10)} — ${runUrl}` });
              core.info(`Updated #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
              core.info(`Opened #${issue.number}`);
            }
            core.setFailed('Broken links found (404/410).');

      - name: Close the issue when links are fixed
        if: ${{ steps.links.outcome == 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'link-check', per_page: 20 });
            for (const issue of open.filter((i) => !i.pull_request)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `No broken links as of ${new Date().toISOString().slice(0, 10)} — ${runUrl}. Closing.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
