name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, tests, data checks, web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # Every check below runs even if an earlier one failed, so one CI run shows all problems.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --ci

      - name: Validate data packs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:packs

      - name: Translation parity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:i18n

      - name: Honesty lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:honesty

      - name: Contrast check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:contrast

      - name: VERIFICATION.md is up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/gen-verification.ts --check

      - name: Web export (smoke build)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx expo export --platform web
